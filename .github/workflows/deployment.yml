name: Continous Deployment

on:
  push:
    branches: [master]

jobs:
  build:
    name: 'Build 📦 & Deploy 🚀'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: 'Build 📦'
        run: |
          npm run build
          cp CNAME dist/
          touch dist/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4.3.4
        name: 'Deploy 🚀'
        with:
          folder: dist
          clean: true
