name: Continous Deployment

on:
  push:
    branches: [master]

jobs:
  build:
    name: 'Build 📦 & Deploy 🚀'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm --prefix astro ci

      - name: 'Build 📦'
        run: |
          npm --prefix astro run build
          cp CNAME astro/dist/
          touch astro/dist/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4.3.4
        name: 'Deploy 🚀'
        with:
          folder: astro/dist
          clean: true
